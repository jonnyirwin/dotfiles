<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Fix Dank Mono Italic missing spacing property for kitty -->
  <match target="scan">
    <test name="family">
      <string>Dank Mono</string>
    </test>
    <test name="style">
      <string>Italic</string>
    </test>
    <edit name="spacing">
      <int>100</int>
    </edit>
  </match>
</fontconfig>
