; Polybar — X11 analogue of waybar. Visual parity: catppuccin mocha palette,
; mantle bar, surface0 capsule segments, Dank Mono 12. True rounded pills
; aren't available at the module level in polybar; segments are rectangular
; but the spacing, palette and content match the sway+waybar setup.
;
; Per-host files under hosts/<hostname>.ini include this file and override
; [bar/main] modules-* to reflect the machine's hardware (battery on laptops,
; no battery/backlight on desktops). launch.sh selects the host file.

[colors]
rosewater = #f5e0dc
flamingo  = #f2cdcd
pink      = #f5c2e7
mauve     = #cba6f7
red       = #f38ba8
maroon    = #eba0ac
peach     = #fab387
yellow    = #f9e2af
green     = #a6e3a1
teal      = #94e2d5
sky       = #89dceb
sapphire  = #74c7ec
blue      = #89b4fa
lavender  = #b4befe
text      = #cdd6f4
subtext1  = #bac2de
subtext0  = #a6adc8
overlay2  = #9399b2
overlay1  = #7f849c
overlay0  = #6c7086
surface2  = #585b70
surface1  = #45475a
surface0  = #313244
base      = #1e1e2e
mantle    = #181825
crust     = #11111b

; ── Bar ────────────────────────────────────────────────────────────────────

[bar/main]
monitor =
width = 100%
height = 32
fixed-center = true

background = ${colors.mantle}
foreground = ${colors.text}

padding-left = 1
padding-right = 2

module-margin-left = 1
module-margin-right = 1

font-0 = Dank Mono:size=12;3
font-1 = Symbols Nerd Font Mono:size=14;3
font-2 = Noto Color Emoji:scale=10;3

; Default module list — host files can override.
modules-left = pomodoro workspaces
modules-center = music
modules-right = audio-output pulseaudio backlight battery idle clock tray

tray-position = right
tray-background = ${colors.mantle}
tray-padding = 4
tray-maxsize = 20

cursor-click = pointer
cursor-scroll = ns-resize

wm-restack = i3
override-redirect = false

; Reload when the set of monitors changes.
[settings]
screenchange-reload = true
pseudo-transparency = false

; ── Workspaces ─────────────────────────────────────────────────────────────

[module/workspaces]
type = internal/i3
pin-workspaces = false
show-urgent = true
strip-wsnumbers = false
index-sort = true
enable-click = true
enable-scroll = false

format = <label-state> <label-mode>

label-focused = %name%
label-focused-background = ${colors.mauve}
label-focused-foreground = ${colors.crust}
label-focused-padding = 2

label-visible = %name%
label-visible-background = ${colors.surface1}
label-visible-foreground = ${colors.text}
label-visible-padding = 2

label-unfocused = %name%
label-unfocused-background = ${colors.surface0}
label-unfocused-foreground = ${colors.overlay1}
label-unfocused-padding = 2

label-urgent = %name%
label-urgent-background = ${colors.peach}
label-urgent-foreground = ${colors.crust}
label-urgent-padding = 2

; ── Clock ──────────────────────────────────────────────────────────────────

[module/clock]
type = internal/date
interval = 1
date = %H:%M
date-alt = %Y-%m-%d
label = 󰥔  %date%
format-foreground = ${colors.blue}
format-background = ${colors.surface0}
format-padding = 2

; ── Pulseaudio ─────────────────────────────────────────────────────────────

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false

format-volume = <label-volume>
label-volume =   %percentage:3%%
label-volume-foreground = ${colors.sapphire}
label-muted = 󰝟   ---%
label-muted-foreground = ${colors.overlay1}

format-volume-background = ${colors.surface0}
format-volume-padding = 2
format-muted-background = ${colors.surface0}
format-muted-padding = 2

click-right = ~/.config/waybar/scripts/audio-switch.sh
click-middle = pavucontrol

; ── Backlight (laptops) ────────────────────────────────────────────────────

[module/backlight]
type = internal/backlight
; Autodetection of card name is flaky; set via `ls /sys/class/backlight/`.
card = intel_backlight
use-actual-brightness = true
enable-scroll = true

format = <ramp>  <label>
label = %percentage:3%%
ramp-0 =
ramp-1 =
ramp-2 =

format-foreground = ${colors.yellow}
format-background = ${colors.surface0}
format-padding = 2

scroll-up = brightnessctl set 1%+
scroll-down = brightnessctl set 1%-

; ── Battery (laptops) ──────────────────────────────────────────────────────

[module/battery]
type = internal/battery
; Find via `ls /sys/class/power_supply/`.
battery = BAT0
adapter = AC
full-at = 99

format-charging = <label-charging>
format-discharging = <ramp-capacity>  <label-discharging>
format-full = 󰂂  <label-full>

label-charging = 󰂄  %percentage:3%%
label-discharging = %percentage:3%%
label-full = %percentage:3%%

ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁻
ramp-capacity-3 = 󰁼
ramp-capacity-4 = 󰁽
ramp-capacity-5 = 󰁾
ramp-capacity-6 = 󰁿
ramp-capacity-7 = 󰂀
ramp-capacity-8 = 󰂁
ramp-capacity-9 = 󰂂

format-charging-foreground = ${colors.teal}
format-charging-background = ${colors.surface0}
format-charging-padding = 2
format-discharging-foreground = ${colors.green}
format-discharging-background = ${colors.surface0}
format-discharging-padding = 2
format-full-foreground = ${colors.green}
format-full-background = ${colors.surface0}
format-full-padding = 2

; ── Music (playerctl) ──────────────────────────────────────────────────────

[module/music]
type = custom/script
exec = playerctl metadata --format='   {{ title }}' 2>/dev/null
interval = 5
tail = false
click-left = playerctl play-pause
format-foreground = ${colors.mauve}
format-background = ${colors.surface0}
format-padding = 2

; ── Pomodoro ───────────────────────────────────────────────────────────────

[module/pomodoro]
type = custom/script
exec = ~/.config/polybar/scripts/pomodoro-wrapper.sh
interval = 1
click-left = ~/.config/waybar/scripts/pomodoro-menu.sh
format-foreground = ${colors.peach}
format-background = ${colors.surface0}
format-padding = 2

; ── Audio output (current sink name) ───────────────────────────────────────

[module/audio-output]
type = custom/script
exec = ~/.config/waybar/scripts/audio-output.sh
interval = 2
click-left = ~/.config/waybar/scripts/audio-switch.sh
format-foreground = ${colors.sapphire}
format-background = ${colors.surface0}
format-padding = 2

; ── Idle inhibitor ─────────────────────────────────────────────────────────
; Toggle DPMS + screensaver. Click to flip; polybar-msg cycles hook state.

[module/idle]
type = custom/ipc
initial = 1

hook-0 = echo "󰾪"
hook-1 = echo "󰅶"

click-left = polybar-msg action "#idle.next" && ~/.config/polybar/scripts/idle-toggle.sh

format-foreground = ${colors.overlay2}
format-background = ${colors.surface0}
format-padding = 2
