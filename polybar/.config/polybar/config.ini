; Polybar — X11 analogue of waybar. Pill-style segments using Powerline Extra
; half-circle caps (U+E0B6/U+E0B4) so each module is a true capsule matching
; waybar's surface0 pills and tmux's window-status-format. Focused workspace
; uses crust-on-mauve (the unifying focus treatment).
;
; Per-host files under hosts/<hostname>.ini include this file and override
; [bar/main] modules-* to reflect the machine's hardware (battery on laptops,
; no battery/backlight on desktops). launch.sh selects the host file.

[colors]
rosewater = #f5e0dc
flamingo  = #f2cdcd
pink      = #f5c2e7
mauve     = #cba6f7
red       = #f38ba8
maroon    = #eba0ac
peach     = #fab387
yellow    = #f9e2af
green     = #a6e3a1
teal      = #94e2d5
sky       = #89dceb
sapphire  = #74c7ec
blue      = #89b4fa
lavender  = #b4befe
text      = #cdd6f4
subtext1  = #bac2de
subtext0  = #a6adc8
overlay2  = #9399b2
overlay1  = #7f849c
overlay0  = #6c7086
surface2  = #585b70
surface1  = #45475a
surface0  = #313244
base      = #1e1e2e
mantle    = #181825
crust     = #11111b

; ── Bar ────────────────────────────────────────────────────────────────────

[bar/main]
monitor =
width = 100%
height = 32
fixed-center = true

background = ${colors.mantle}
foreground = ${colors.text}

padding-left = 1
padding-right = 2

module-margin-left = 0
module-margin-right = 0

; font-1 supplies Powerline Extra half-circles (U+E0B4/U+E0B6) for pill caps.
font-0 = Dank Mono:size=12;3
font-1 = Symbols Nerd Font Mono:size=16;4
font-2 = Noto Color Emoji:scale=10;3

; Default module list — host files can override.
modules-left = pomodoro workspaces
modules-center = music
modules-right = audio-output pulseaudio backlight battery idle clock tray

tray-position = right
tray-background = ${colors.mantle}
tray-padding = 4
tray-maxsize = 20

cursor-click = pointer
cursor-scroll = ns-resize

wm-restack = i3
override-redirect = false

; Reload when the set of monitors changes.
[settings]
screenchange-reload = true
pseudo-transparency = false

; ── Workspaces ─────────────────────────────────────────────────────────────
; Each workspace renders as its own capsule. Inline %{...} tags paint the
; half-circle caps in the pill colour against the mantle bar, then flip the
; background for the name. Mirrors waybar's #workspaces button layout.

[module/workspaces]
type = internal/i3
pin-workspaces = false
show-urgent = true
strip-wsnumbers = false
index-sort = true
enable-click = true
enable-scroll = false

format = <label-state> <label-mode>

label-focused = %{T2}%{F#cba6f7 B-}%{T-}%{F#11111b B#cba6f7} %name% %{T2}%{B- F#cba6f7}%{T- F- B-}
label-focused-padding = 0

label-visible = %{T2}%{F#45475a B-}%{T-}%{F#cdd6f4 B#45475a} %name% %{T2}%{B- F#45475a}%{T- F- B-}
label-visible-padding = 0

label-unfocused = %{T2}%{F#313244 B-}%{T-}%{F#7f849c B#313244} %name% %{T2}%{B- F#313244}%{T- F- B-}
label-unfocused-padding = 0

label-urgent = %{T2}%{F#fab387 B-}%{T-}%{F#11111b B#fab387} %name% %{T2}%{B- F#fab387}%{T- F- B-}
label-urgent-padding = 0

; ── Clock ──────────────────────────────────────────────────────────────────

[module/clock]
type = internal/date
interval = 1
date = %H:%M
date-alt = %Y-%m-%d
label = 󰥔  %date%
format = <label>
format-prefix = "%{T2}%{T-}"
format-prefix-foreground = ${colors.surface0}
format-suffix = "%{T2}%{T-}"
format-suffix-foreground = ${colors.surface0}
label-foreground = ${colors.blue}
label-background = ${colors.surface0}
label-padding = 1

; ── Pulseaudio ─────────────────────────────────────────────────────────────

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false

format-volume = <label-volume>
format-volume-prefix = "%{T2}%{T-}"
format-volume-prefix-foreground = ${colors.surface0}
format-volume-suffix = "%{T2}%{T-}"
format-volume-suffix-foreground = ${colors.surface0}
label-volume =   %percentage:3%%
label-volume-foreground = ${colors.sapphire}
label-volume-background = ${colors.surface0}
label-volume-padding = 1

format-muted = <label-muted>
format-muted-prefix = "%{T2}%{T-}"
format-muted-prefix-foreground = ${colors.surface0}
format-muted-suffix = "%{T2}%{T-}"
format-muted-suffix-foreground = ${colors.surface0}
label-muted = 󰝟   ---%
label-muted-foreground = ${colors.overlay1}
label-muted-background = ${colors.surface0}
label-muted-padding = 1

click-right = ~/.config/waybar/scripts/audio-switch.sh
click-middle = pavucontrol

; ── Backlight (laptops) ────────────────────────────────────────────────────

[module/backlight]
type = internal/backlight
; Autodetection of card name is flaky; set via `ls /sys/class/backlight/`.
card = intel_backlight
use-actual-brightness = true
enable-scroll = true

format = <ramp>  <label>
format-prefix = "%{T2}%{T-}"
format-prefix-foreground = ${colors.surface0}
format-suffix = "%{T2}%{T-}"
format-suffix-foreground = ${colors.surface0}
format-background = ${colors.surface0}
format-foreground = ${colors.yellow}
format-padding = 1
label = %percentage:3%%
ramp-0 =
ramp-1 =
ramp-2 =

scroll-up = brightnessctl set 1%+
scroll-down = brightnessctl set 1%-

; ── Battery (laptops) ──────────────────────────────────────────────────────

[module/battery]
type = internal/battery
; Find via `ls /sys/class/power_supply/`.
battery = BAT0
adapter = AC
full-at = 99

format-charging = <label-charging>
format-charging-prefix = "%{T2}%{T-}"
format-charging-prefix-foreground = ${colors.surface0}
format-charging-suffix = "%{T2}%{T-}"
format-charging-suffix-foreground = ${colors.surface0}
label-charging = 󰂄  %percentage:3%%
label-charging-foreground = ${colors.teal}
label-charging-background = ${colors.surface0}
label-charging-padding = 1

format-discharging = <ramp-capacity>  <label-discharging>
format-discharging-prefix = "%{T2}%{T-}"
format-discharging-prefix-foreground = ${colors.surface0}
format-discharging-suffix = "%{T2}%{T-}"
format-discharging-suffix-foreground = ${colors.surface0}
format-discharging-background = ${colors.surface0}
format-discharging-foreground = ${colors.green}
format-discharging-padding = 1
label-discharging = %percentage:3%%

format-full = 󰂂  <label-full>
format-full-prefix = "%{T2}%{T-}"
format-full-prefix-foreground = ${colors.surface0}
format-full-suffix = "%{T2}%{T-}"
format-full-suffix-foreground = ${colors.surface0}
format-full-background = ${colors.surface0}
format-full-foreground = ${colors.green}
format-full-padding = 1
label-full = %percentage:3%%

ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁻
ramp-capacity-3 = 󰁼
ramp-capacity-4 = 󰁽
ramp-capacity-5 = 󰁾
ramp-capacity-6 = 󰁿
ramp-capacity-7 = 󰂀
ramp-capacity-8 = 󰂁
ramp-capacity-9 = 󰂂

; ── Music (playerctl) ──────────────────────────────────────────────────────

[module/music]
type = custom/script
exec = playerctl metadata --format='   {{ title }}' 2>/dev/null
interval = 5
tail = false
click-left = playerctl play-pause
format = <label>
format-prefix = "%{T2}%{T-}"
format-prefix-foreground = ${colors.surface0}
format-suffix = "%{T2}%{T-}"
format-suffix-foreground = ${colors.surface0}
label = %output%
label-foreground = ${colors.mauve}
label-background = ${colors.surface0}
label-padding = 1

; ── Pomodoro ───────────────────────────────────────────────────────────────

[module/pomodoro]
type = custom/script
exec = ~/.config/polybar/scripts/pomodoro-wrapper.sh
interval = 1
click-left = ~/.config/waybar/scripts/pomodoro-menu.sh
format = <label>
format-prefix = "%{T2}%{T-}"
format-prefix-foreground = ${colors.surface0}
format-suffix = "%{T2}%{T-}"
format-suffix-foreground = ${colors.surface0}
label = %output%
label-foreground = ${colors.peach}
label-background = ${colors.surface0}
label-padding = 1

; ── Audio output (current sink name) ───────────────────────────────────────

[module/audio-output]
type = custom/script
exec = ~/.config/waybar/scripts/audio-output.sh
interval = 2
click-left = ~/.config/waybar/scripts/audio-switch.sh
format = <label>
format-prefix = "%{T2}%{T-}"
format-prefix-foreground = ${colors.surface0}
format-suffix = "%{T2}%{T-}"
format-suffix-foreground = ${colors.surface0}
label = %output%
label-foreground = ${colors.sapphire}
label-background = ${colors.surface0}
label-padding = 1

; ── Idle inhibitor ─────────────────────────────────────────────────────────
; Toggle DPMS + screensaver. Click to flip; polybar-msg cycles hook state.

[module/idle]
type = custom/ipc
initial = 1

hook-0 = echo "󰾪"
hook-1 = echo "󰅶"

click-left = polybar-msg action "#idle.next" && ~/.config/polybar/scripts/idle-toggle.sh

format = <output>
format-prefix = "%{T2}%{T-}"
format-prefix-foreground = ${colors.surface0}
format-suffix = "%{T2}%{T-}"
format-suffix-foreground = ${colors.surface0}
format-foreground = ${colors.overlay2}
format-background = ${colors.surface0}
format-padding = 1
