# Starship — discrete pill segments matching waybar/tmux/rofi house style.
# Each module is its own surface0 capsule with Powerline Extra half-circle caps
# (U+E0B6 left, U+E0B4 right). Accent colour per category mirrors waybar's
# module palette: teal session, peach directory, green git, sapphire lang,
# blue time, mauve prompt character (the unifying focus colour).

add_newline = true
palette = "catppuccin_mocha"

format = """\
$username\
$directory\
$git_branch\
$git_status\
$dotnet$elixir$elm$haskell$lua$nix_shell$nodejs$ocaml$python$rust$scala$shell$vagrant\
$time\
$line_break$character\
"""

[character]
error_symbol = "[❯](bold fg:red)"
success_symbol = "[❯](bold fg:accent)"
vimcmd_symbol = "[❮](bold fg:accent)"

[username]
show_always = true
format = "[](fg:surface0)[ 󰀄 $user ](fg:teal bg:surface0)[](fg:surface0) "
style_user = "fg:teal bg:surface0"
style_root = "fg:red bg:surface0"

[directory]
format = "[](fg:surface0)[  $path ](fg:peach bg:surface0)[](fg:surface0) "
truncation_length = 4
truncation_symbol = "…/"

[git_branch]
symbol = ""
format = "[](fg:surface0)[  $branch ](fg:green bg:surface0)[](fg:surface0) "

[git_status]
disabled = false
format = "[](fg:surface0)[ ❲$all_status$ahead_behind❳ ](fg:green bg:surface0)[](fg:surface0) "

[time]
disabled = false
format = "[](fg:surface0)[ 󰥔 $time ](fg:blue bg:surface0)[](fg:surface0)"
time_format = "%H:%M"

[dotnet]
disabled = false
format = "[](fg:surface0)[ $symbol$version ](fg:sapphire bg:surface0)[](fg:surface0) "
symbol = " "

[elixir]
disabled = false
format = "[](fg:surface0)[ $symbol$version ](fg:sapphire bg:surface0)[](fg:surface0) "
symbol = " "

[elm]
disabled = false
format = "[](fg:surface0)[ $symbol$version ](fg:sapphire bg:surface0)[](fg:surface0) "
symbol = " "

[haskell]
disabled = false
format = "[](fg:surface0)[ $symbol$version ](fg:sapphire bg:surface0)[](fg:surface0) "
symbol = " "

[lua]
disabled = false
format = "[](fg:surface0)[ $symbol$version ](fg:sapphire bg:surface0)[](fg:surface0) "
symbol = " "

[nix_shell]
disabled = false
format = "[](fg:surface0)[ $symbol$state ](fg:sapphire bg:surface0)[](fg:surface0) "
symbol = " "

[nodejs]
disabled = false
format = "[](fg:surface0)[ $symbol$version ](fg:sapphire bg:surface0)[](fg:surface0) "
symbol = " "

[ocaml]
disabled = false
format = "[](fg:surface0)[ $symbol$version ](fg:sapphire bg:surface0)[](fg:surface0) "
symbol = " "

[python]
disabled = false
format = "[](fg:surface0)[ $symbol$version ](fg:sapphire bg:surface0)[](fg:surface0) "
symbol = " "

[rust]
disabled = false
format = "[](fg:surface0)[ $symbol$version ](fg:sapphire bg:surface0)[](fg:surface0) "
symbol = " "

[scala]
disabled = false
format = "[](fg:surface0)[ $symbol$version ](fg:sapphire bg:surface0)[](fg:surface0) "
symbol = " "

[shell]
disabled = true

[vagrant]
disabled = false
format = "[](fg:surface0)[ $symbol$version ](fg:sapphire bg:surface0)[](fg:surface0) "
symbol = " "

