set -g prefix C-a
unbind C-b

set -s escape-time 100
set -g focus-events on

# Enable true color and italic support
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Tc,*:sitm=\E[3m,*:ritm=\E[23m'

# Clipboard integration for Wayland
set -g set-clipboard on
set -s copy-command 'env WAYLAND_DISPLAY=wayland-1 wl-copy'

# Preserve Wayland environment variables
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP"

set -g base-index 1
set -g pane-base-index 1

bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux config."

#bind C-a send-prefix

bind | split-window -h
bind - split-window -v

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy mode bindings for Wayland
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'env WAYLAND_DISPLAY=wayland-1 wl-copy'
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'env WAYLAND_DISPLAY=wayland-1 wl-copy'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'env WAYLAND_DISPLAY=wayland-1 wl-copy'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin '@catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'jonnyirwin/tmux-ai-status'
set -g @ai_window_marker off

set -g @continuum-restore 'on'

set -g @catppuccin_flavour 'mocha'

# Window tabs mirror waybar's #workspaces: current = crust on mauve.
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W#{?@ai_window_tool, 󰚩,} "
set -g @catppuccin_window_current_text " #W#{?@ai_window_tool, 󰚩,} "
set -g @catppuccin_window_default_color "#{@thm_overlay_1}"
set -g @catppuccin_window_default_background "#{@thm_surface_0}"
set -g @catppuccin_window_current_color "#{@thm_crust}"
set -g @catppuccin_window_current_background "#{@thm_mauve}"
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "no"

run '~/.tmux/plugins/tpm/tpm'
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
run ~/.config/tmux/plugins/tmux-ai-status/ai-status.tmux

# Right-side modules: flat surface0 pills with accent icon+text, waybar-style.
set -g "@catppuccin_status_application" "#[fg=#{@thm_surface_0},bg=default]#[fg=#{@thm_mauve},bg=#{@thm_surface_0}]  #{pane_current_command} #[fg=#{@thm_surface_0},bg=default]"
set -g "@catppuccin_status_date"        "#[fg=#{@thm_surface_0},bg=default]#[fg=#{@thm_peach},bg=#{@thm_surface_0}] 󰃭 %Y-%m-%d #[fg=#{@thm_surface_0},bg=default]"
set -g "@catppuccin_status_time"        "#[fg=#{@thm_surface_0},bg=default]#[fg=#{@thm_blue},bg=#{@thm_surface_0}] 󰥔 %H:%M #[fg=#{@thm_surface_0},bg=default]"
set -g "@catppuccin_status_ai"          "#[fg=#{@thm_surface_0},bg=default]#[fg=#{@thm_mauve},bg=#{@thm_surface_0}] 󰚩 #{@ai_total} #[fg=#{@thm_surface_0},bg=default]"
set -g "@catppuccin_status_session"     "#[fg=#{@thm_surface_0},bg=default]#[fg=#{@thm_teal},bg=#{@thm_surface_0}]  #S #[fg=#{@thm_surface_0},bg=default]"

set -g status-left ""
set -g status-left-length 100
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_application} #{E:@catppuccin_status_date} #{E:@catppuccin_status_time} #{?@ai_total,#{E:@catppuccin_status_ai} ,}#{E:@catppuccin_status_session}"

# Pane borders: subtle grey + mauve focus, matching waybar's accent.
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#cba6f7"
set -g pane-border-lines single
