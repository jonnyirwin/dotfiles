set -g prefix C-a
unbind C-b

set -s escape-time 100
set -g focus-events on

# Mouse: drag selects within a pane, release triggers MouseDragEnd1Pane →
# tmux-copy → OSC 52 (over SSH) or wl-copy/xclip (locally).
set -g mouse on

# Enable true color and italic support
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Tc,*:sitm=\E[3m,*:ritm=\E[23m'

# Clipboard integration. `set-clipboard on` makes tmux emit OSC 52, which is
# what lets SSH sessions (e.g. Windows Terminal) round-trip the selection back
# to the host clipboard. `copy-command` and the copy-mode bindings below use a
# shim that prefers Wayland/X11 locally and degrades to a no-op (relying on
# OSC 52) when neither is available — i.e. on the work box over SSH.
set -g set-clipboard on
set -s copy-command 'tmux-copy'

# Preserve Wayland environment variables
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP"

set -g base-index 1
set -g pane-base-index 1

bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux config."

#bind C-a send-prefix

bind | split-window -h
bind - split-window -v

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy mode bindings — see tmux-copy for backend selection.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'tmux-copy'
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'tmux-copy'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'tmux-copy'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin '@catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'jonnyirwin/tmux-ai-status'
set -g @ai_window_marker off

set -g @continuum-restore 'on'

set -g @catppuccin_flavour 'mocha'

set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "no"

# TPM under XDG. TPM honours $TMUX_PLUGIN_MANAGER_PATH for plugin installs,
# and we point its bootstrap at the tracked copy under ~/.config so there is
# one canonical location instead of the legacy ~/.tmux/ mirror.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"
run '~/.config/tmux/plugins/tpm/tpm'
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
run ~/.config/tmux/plugins/tmux-ai-status/ai-status.tmux

# >>> catppuccin-accent
# Single source for "the focus colour". Rewritten by ~/.dotfiles/catppuccin/.local/bin/set-accent.
set -g @thm_accent "#cba6f7"
# <<< catppuccin-accent

# Window tabs mirror the right-side pills — flat surface0 with rounded caps,
# inactive in overlay_1, current in accent-on-crust like waybar's focused
# #workspaces button.
#
# Bell alerts are folded into the pill itself rather than catppuccin's blanket
# yellow style (which bled onto the bg=default caps and drew a rectangle around
# the pill). Neutralise that style; the inactive window-status-format below then
# turns the pill TEXT yellow on a bell via #{?window_bell_flag,...}. The current
# window is deliberately left plain: tmux clears window_bell_flag the instant the
# attached client renders the window you're on, so a current-pill highlight could
# never actually paint (verified — attachment, not focus, is the gate).
set -g window-status-bell-style "default"
set -g window-status-separator " "
set -g window-status-format "#[fg=#{@thm_surface_0},bg=default]#[fg=#{?window_bell_flag,#{@thm_yellow},#{@thm_overlay_1}},bg=#{@thm_surface_0}] #I:#W#{?@ai_window_tool, 󰚩,} #[fg=#{@thm_surface_0},bg=default]"
set -g window-status-current-format "#[fg=#{@thm_accent},bg=default]#[fg=#{@thm_crust},bg=#{@thm_accent}] #I:#W#{?@ai_window_tool, 󰚩,} #[fg=#{@thm_accent},bg=default]"

# Right-side modules: flat surface0 pills with accent icon+text, waybar-style.
set -g "@catppuccin_status_application" "#[fg=#{@thm_surface_0},bg=default]#[fg=#{@thm_accent},bg=#{@thm_surface_0}]  #{pane_current_command} #[fg=#{@thm_surface_0},bg=default]"
set -g "@catppuccin_status_date"        "#[fg=#{@thm_surface_0},bg=default]#[fg=#{@thm_peach},bg=#{@thm_surface_0}] 󰃭 %Y-%m-%d #[fg=#{@thm_surface_0},bg=default]"
set -g "@catppuccin_status_time"        "#[fg=#{@thm_surface_0},bg=default]#[fg=#{@thm_blue},bg=#{@thm_surface_0}] 󰥔 %H:%M #[fg=#{@thm_surface_0},bg=default]"
set -g "@catppuccin_status_ai"          "#[fg=#{@thm_surface_0},bg=default]#[fg=#{@thm_accent},bg=#{@thm_surface_0}] 󰚩 #{@ai_total} #[fg=#{@thm_surface_0},bg=default]"
set -g "@catppuccin_status_session"     "#[fg=#{@thm_surface_0},bg=default]#[fg=#{@thm_teal},bg=#{@thm_surface_0}] ⊞ #S #[fg=#{@thm_surface_0},bg=default]"

set -g status-left ""
set -g status-left-length 100
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_application} #{E:@catppuccin_status_date} #{E:@catppuccin_status_time} #{?@ai_total,#{E:@catppuccin_status_ai} ,}#{E:@catppuccin_status_session}"

# Pane borders: subtle grey + mauve focus, matching waybar's accent.
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#{@thm_accent}"
set -g pane-border-lines single

# Per-pane pill on the top border — same vocabulary as window tabs and the
# right-side status modules. Inactive: flat surface0 with overlay_1 text.
# Active: crust-on-mauve, matching the focused window tab / waybar workspace.
# Title chip ("· name") only shows if the pane title differs from the host
# default, so an un-named pane stays clean.
set -g pane-border-status top
set -g pane-border-format "#[align=right]#{?pane_active,#[fg=#{@thm_accent}#,bg=default]#[fg=#{@thm_crust}#,bg=#{@thm_accent}] #P #{pane_current_command}#{?#{!=:#{pane_title},#{host_short}}, · #{pane_title},} #[fg=#{@thm_accent}#,bg=default]#[bg=default],#[fg=#{@thm_surface_0}#,bg=default]#[fg=#{@thm_overlay_1}#,bg=#{@thm_surface_0}] #P #{pane_current_command}#{?#{!=:#{pane_title},#{host_short}}, · #{pane_title},} #[fg=#{@thm_surface_0}#,bg=default]#[bg=default]}#{?@ai_pane_tool,,}"

# prefix + T renames the current pane. (prefix + , stays as rename-window.)
bind T command-prompt -p "pane title:" "select-pane -T '%%'"
